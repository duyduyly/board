<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Card Atlas — Visual Graph Editor</title>
    <link rel="icon" href="assets/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div id="app" class="home-mode">
      <header class="toolbar">
        <button
          class="brand"
          data-action="home"
          data-i18n-aria="brandHome"
          aria-label="Card Atlas — Home"
        >
          <span class="brand-mark" aria-hidden="true">
            <img class="brand-anim" src="assets/images/brand/logo-anim.webp" alt="" />
            <img class="brand-still" src="assets/images/brand/logo-still.webp" alt="" />
          </span>
        </button>
        <button id="project-name" class="project-name"></button>
        <div class="toolbar-actions">
          <button data-action="new" data-i18n="newProject"></button>
          <div id="map-view" class="view-switch" role="group" data-i18n-title="mapView">
            <button
              type="button"
              data-map-view="card"
              aria-pressed="true"
              data-i18n="cardMap"
            ></button>
            <button
              type="button"
              data-map-view="mind"
              aria-pressed="false"
              data-i18n="mindMap"
            ></button>
            <button
              type="button"
              data-map-view="timeline"
              aria-pressed="false"
              data-i18n="timelineView"
            ></button>
          </div>
          <div class="history-buttons">
            <button data-action="undo" data-i18n-title="undo">↶</button
            ><button data-action="redo" data-i18n-title="redo">↷</button>
          </div>
          <button data-action="import" data-i18n="import"></button>
          <details id="export-menu" class="export-menu">
            <summary class="primary with-icon" data-i18n-title="exportMenuHint">
              <span aria-hidden="true">↑</span><span data-i18n="exportMenu"></span
              ><span class="export-menu-caret" aria-hidden="true">▾</span>
            </summary>
            <div class="export-menu-body">
              <button
                type="button"
                data-action="export"
                aria-labelledby="export-json-label"
                aria-describedby="export-json-hint"
              >
                <span id="export-json-label" class="export-option-label" data-i18n="export"></span>
                <span
                  id="export-json-hint"
                  class="export-option-hint"
                  data-i18n="exportProjectHint"
                ></span>
              </button>
              <button
                type="button"
                data-action="export-word"
                aria-labelledby="export-word-label"
                aria-describedby="export-word-hint"
              >
                <span
                  id="export-word-label"
                  class="export-option-label"
                  data-i18n="exportWord"
                ></span>
                <span
                  id="export-word-hint"
                  class="export-option-hint"
                  data-i18n="exportWordHint"
                ></span>
              </button>
              <button
                type="button"
                data-action="export-markdown"
                aria-labelledby="export-markdown-label"
                aria-describedby="export-markdown-hint"
              >
                <span
                  id="export-markdown-label"
                  class="export-option-label"
                  data-i18n="exportMarkdown"
                ></span>
                <span
                  id="export-markdown-hint"
                  class="export-option-hint"
                  data-i18n="exportMarkdownHint"
                ></span>
              </button>
            </div>
          </details>
          <button
            id="theme-toggle"
            data-action="theme"
            data-i18n-title="darkMode"
            aria-pressed="false"
          >
            <span aria-hidden="true">◐</span><span data-i18n="lightTheme"></span></button
          ><select id="locale" aria-label="Tiếng Việt / English">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
          </select>
          <details id="project-menu" class="project-menu">
            <summary
              id="quick-help"
              class="quick-help-button"
              data-i18n-title="helpAndTools"
              aria-label="Help and project tools"
            >
              <span aria-hidden="true">?</span>
            </summary>
            <div class="project-menu-body">
              <section class="menu-group" aria-labelledby="menu-group-help">
                <h3 id="menu-group-help" class="menu-group-title" data-i18n="menuGroupHelp"></h3>
                <button data-action="help" data-i18n="quickHelpTitle"></button>
                <button data-action="format" data-i18n="format"></button>
              </section>
              <section class="menu-group" aria-labelledby="menu-group-project">
                <h3
                  id="menu-group-project"
                  class="menu-group-title"
                  data-i18n="menuGroupProject"
                ></h3>
                <button data-action="inspector" data-i18n="inspectorTitle"></button>
                <button data-action="convert-mind" data-i18n="convertMind"></button>
                <button data-action="timeline-remove" data-i18n="timelineRemove" hidden></button>
                <div id="counts"></div>
                <p id="save-state" class="save-state"></p>
                <button data-action="auto-route-all" data-i18n="autoRouteAll"></button>
              </section>
              <section class="menu-group" aria-labelledby="menu-group-session">
                <h3
                  id="menu-group-session"
                  class="menu-group-title"
                  data-i18n="menuGroupSession"
                ></h3>
                <p class="session-note" data-i18n="session"></p>
                <button
                  data-action="recovery"
                  class="recovery-button"
                  data-i18n="recovery"
                ></button>
                <p id="recovery-status" class="muted recovery-status" role="status"></p>
                <div class="chatgpt-settings">
                  <label>
                    <input
                      id="chatgpt-visible"
                      type="checkbox"
                      checked
                      aria-controls="chatgpt-launcher"
                    />
                    <span data-i18n="chatgptShowButton"></span>
                  </label>
                  <a
                    href="https://chatgpt.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                    data-i18n="chatgptOpenTab"
                  ></a>
                  <p id="chatgpt-help" class="muted" data-i18n="chatgptHelp"></p>
                </div>
                <label class="pet-choice" for="pet-choice">
                  <span data-i18n="petLabel"></span>
                  <select id="pet-choice">
                    <option value="cat" data-i18n="petCat"></option>
                    <option value="dog" data-i18n="petDog"></option>
                    <option value="off" data-i18n="petOff"></option>
                  </select>
                </label>
              </section>
            </div>
          </details>
        </div>
      </header>
      <section id="home-page" class="home-page">
        <div class="home-resume">
          <button data-action="continue" data-i18n="continueProject" hidden></button>
        </div>
        <div id="template-gallery"></div>
      </section>
      <main class="workspace">
        <aside class="sidebar">
          <div id="shape-library"></div>
          <button
            type="button"
            data-action="search"
            data-i18n="searchNodes"
            aria-controls="search-drawer"
            aria-expanded="false"
          ></button>
        </aside>
        <aside id="search-drawer" class="search-drawer" hidden>
          <div class="drawer-header">
            <h2 data-i18n="searchNodes"></h2>
            <button type="button" data-action="search-close" data-i18n-title="closeSearch">
              ×
            </button>
          </div>
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span
            ><input
              id="search"
              type="search"
              data-i18n-placeholder="search"
              data-i18n-title="search"
            />
          </div>
          <div id="card-list" class="card-list"></div>
        </aside>
        <section id="canvas-region" class="canvas-region">
          <div id="chatgpt-launcher" class="chatgpt-launcher">
            <button id="chatgpt-open" type="button" data-i18n-title="chatgptOpenWindow">
              <span aria-hidden="true">↗</span><span class="chatgpt-label">ChatGPT</span>
            </button>
            <button id="chatgpt-hide" type="button" data-i18n-title="chatgptHideButton">×</button>
          </div>
          <div id="graph"></div>
          <div id="cards-layer"></div>
          <section
            id="timeline-view"
            class="timeline-view"
            aria-labelledby="timeline-heading"
            hidden
          >
            <div class="timeline-toolbar">
              <h2 id="timeline-heading" data-i18n="timelineView"></h2>
              <span class="timeline-info">
                <button
                  type="button"
                  class="timeline-info-button"
                  data-i18n-aria="timelineEventOrder"
                ></button>
                <span
                  class="timeline-mode-note"
                  aria-hidden="true"
                  data-i18n="timelineEventOrder"
                ></span>
              </span>
              <select
                id="timeline-status-filter"
                class="timeline-filter"
                data-i18n-aria="timelineFilterLabel"
              >
                <option value="" data-i18n="timelineFilterAll"></option>
                <option value="new" data-i18n="statusNew"></option>
                <option value="in-progress" data-i18n="statusInProgress"></option>
                <option value="done" data-i18n="statusDone"></option>
                <option value="blocked" data-i18n="statusBlocked"></option>
                <option value="cancelled" data-i18n="statusCancelled"></option>
              </select>
              <div class="timeline-nav">
                <button
                  type="button"
                  class="timeline-nav-start"
                  data-timeline-action="start"
                  data-i18n-title="timelineStart"
                ></button>
                <button
                  type="button"
                  data-timeline-action="today"
                  data-i18n="timelineToday"
                ></button>
                <button
                  type="button"
                  class="timeline-nav-end"
                  data-timeline-action="end"
                  data-i18n-title="timelineEnd"
                ></button>
              </div>
              <span class="timeline-count" role="status"></span>
              <button
                type="button"
                class="timeline-overview"
                data-timeline-action="overview"
                data-i18n="timelineOverview"
                data-i18n-title="timelineOverviewHint"
              ></button>
              <button
                type="button"
                class="timeline-add primary"
                data-timeline-action="add-note"
                data-i18n="timelineAddNote"
              ></button>
            </div>
            <div class="timeline-body">
              <div class="timeline-intro">
                <h3 class="timeline-intro-heading">
                  <button
                    type="button"
                    class="timeline-intro-title"
                    data-timeline-action="info"
                    data-timeline-field="title"
                  ></button>
                </h3>
                <p class="timeline-intro-row">
                  <button
                    type="button"
                    class="timeline-intro-description"
                    data-timeline-action="info"
                    data-timeline-field="description"
                  ></button>
                </p>
              </div>
              <div class="timeline-scroll">
                <ol class="timeline-track" data-i18n-aria="timelineRegion"></ol>
              </div>
            </div>
            <details class="timeline-unscheduled" hidden>
              <summary></summary>
              <ul></ul>
            </details>
            <div class="timeline-empty" hidden></div>
          </section>
          <section id="board-scope" class="board-scope" data-i18n-aria="boardScopeLabel" hidden>
            <nav class="board-scope-path" data-i18n-aria="boardScopeLabel">
              <button type="button" data-scope-action="timeline"></button>
              <button type="button" class="board-scope-project" data-scope-action="root"></button>
            </nav>
            <h2 class="board-scope-heading">
              <button type="button" class="board-scope-title" data-scope-edit="title"></button>
              <span
                class="board-scope-overview-title"
                tabindex="-1"
                data-i18n="boardOverviewTitle"
                hidden
              ></span>
            </h2>
            <p class="board-scope-summary-row">
              <button type="button" class="board-scope-summary" data-scope-edit="summary"></button>
            </p>
            <p class="board-scope-meta">
              <span class="board-scope-count"></span>
              <span class="board-scope-hint" hidden></span>
            </p>
          </section>
          <div id="welcome" class="welcome">
            <h1 data-i18n="welcome"></h1>
            <p data-i18n="welcomeBody"></p>
          </div>
          <div id="mind-map-tools" class="mind-map-tools" hidden>
            <button data-action="layout" data-i18n="arrangeMindMap"></button>
            <button data-action="expand-all" data-i18n="expandAll"></button>
          </div>
          <div
            id="layout-preview-bar"
            class="layout-preview-bar"
            role="region"
            data-i18n-title="layoutPreviewTitle"
            hidden
          >
            <strong data-i18n="layoutPreviewTitle"></strong>
            <p data-i18n="layoutPreviewHint"></p>
            <div id="layout-warnings" role="status"></div>
            <div class="layout-preview-actions">
              <button data-action="layout-cancel" data-i18n="cancel"></button
              ><button data-action="layout-reset" data-i18n="resetPreview"></button
              ><button class="primary" data-action="layout-apply" data-i18n="applyLayout"></button>
            </div>
          </div>
          <div id="mind-map-hint" hidden></div>
          <div id="connect-hint" class="connect-hint" hidden></div>
          <div class="zoom-controls">
            <button data-action="zoom-out" data-i18n-title="zoomOut">−</button
            ><button id="zoom-value" data-action="zoom-reset" data-i18n-title="resetZoom">
              100%</button
            ><button data-action="zoom-in" data-i18n-title="zoomIn">＋</button><span></span
            ><button data-action="fit" class="view-button" data-i18n-title="fit">
              <span aria-hidden="true">⛶</span><span data-i18n="fitLabel"></span>
            </button>
            <button data-action="focus" class="view-button" data-i18n-title="focus" disabled>
              <span aria-hidden="true">◎</span><span data-i18n="focusLabel"></span>
            </button>
            <button
              type="button"
              data-action="status-display"
              class="view-button"
              data-i18n-title="statusDisplayHide"
              aria-pressed="true"
            >
              <span aria-hidden="true">●</span><span data-i18n="statusDisplay"></span>
            </button>
          </div>
          <div id="selection-tools" class="selection-tools" hidden>
            <span id="selection-count" role="status" aria-live="polite"></span>
            <button type="button" data-action="group-create" data-i18n="groupCreate"></button>
            <button
              type="button"
              data-action="group-add"
              data-i18n="groupAddCards"
              aria-haspopup="menu"
              hidden
            ></button>
            <button
              type="button"
              data-action="group-remove"
              data-i18n="groupRemoveCards"
              data-i18n-title="groupRemoveCardsHint"
              hidden
            ></button>
            <button
              type="button"
              data-action="selection-duplicate"
              data-i18n="duplicate"
              data-i18n-title="duplicateSelectionHint"
            ></button>
            <details id="selection-json" class="selection-json">
              <summary data-i18n="selectionJsonMenu"></summary>
              <div class="selection-json-menu">
                <p data-i18n="selectionJsonScope"></p>
                <button
                  type="button"
                  data-action="selection-copy-json"
                  data-i18n="selectionJsonCopy"
                ></button>
                <button
                  type="button"
                  data-action="selection-download-json"
                  data-i18n="selectionJsonDownload"
                ></button>
              </div>
            </details>
            <button type="button" data-action="clear-selection" data-i18n="clearSelection"></button>
          </div>
          <div id="mind-view-banner" hidden>
            <strong data-i18n="mindMap"></strong><span data-i18n="mindViewHint"></span>
          </div>
          <div class="canvas-hint" data-i18n="hint"></div>
          <svg id="connection-preview" class="connection-preview" aria-hidden="true">
            <path></path>
          </svg>
        </section>
        <aside id="format-inspector" hidden aria-labelledby="inspector-title">
          <header>
            <h2 id="inspector-title" data-i18n="inspectorTitle"></h2>
            <button id="inspector-close" data-i18n-title="close">×</button>
          </header>
          <nav id="inspector-tabs" data-i18n-aria="inspectorTabsLabel" aria-label="Format"></nav>
          <div id="inspector-global" hidden></div>
          <div id="inspector-text" hidden></div>
          <p id="inspector-edge-hint" hidden></p>
          <div id="inspector-fields"></div>
        </aside>
        <dialog id="detail-panel" class="detail-panel" aria-labelledby="panel-title">
          <div class="panel-header">
            <h2 id="panel-title" tabindex="-1"></h2>
            <div class="panel-actions">
              <span id="panel-save-status" class="panel-save-status" role="status" hidden></span>
              <button
                id="reading-text-smaller"
                class="reading-text-size"
                hidden
                data-action="reading-text-smaller"
                data-i18n-title="readingTextSmaller"
              >
                A−</button
              ><button
                id="reading-text-larger"
                class="reading-text-size"
                hidden
                data-action="reading-text-larger"
                data-i18n-title="readingTextLarger"
              >
                A+
              </button>
              <button data-action="detail-theme" data-i18n-title="darkMode" id="detail-theme">
                ◐
              </button>
              <button
                id="writing-exit"
                hidden
                data-action="writing-exit"
                data-i18n="exitWriting"
              ></button>
              <button data-action="expand" data-i18n-title="fullDetail">⤢</button
              ><button data-action="close" data-i18n-title="close">×</button>
            </div>
          </div>
          <nav id="panel-tabs" class="panel-tabs"></nav>
          <div id="panel-body" class="panel-body"></div>
          <details id="detail-tools" class="detail-tools">
            <summary data-i18n="projectTools" data-i18n-title="projectTools"></summary>
            <div class="detail-tool-actions">
              <select id="detail-map-view" data-i18n-title="mapView">
                <option value="card" data-i18n="cardMap"></option>
                <option value="mind" data-i18n="mindMap"></option>
                <option value="timeline" data-i18n="timelineView" hidden></option>
              </select>
              <button data-panel-action="undo" data-i18n="undo"></button
              ><button data-panel-action="redo" data-i18n="redo"></button>
              <button data-panel-action="export" data-i18n="export"></button
              ><button data-panel-action="new" data-i18n="newProject"></button>
              <button data-panel-action="format" data-i18n="format"></button
              ><button data-panel-action="recovery" data-i18n="recovery"></button>
              <button data-panel-action="layout" data-i18n="arrangeMindMap"></button
              ><button data-panel-action="focus" data-i18n="focusLabel"></button
              ><button data-panel-action="fit" data-i18n="fitLabel"></button>
            </div>
          </details>
        </dialog>
      </main>
      <div class="mobile-notice" data-i18n="desktop"></div>
      <div id="toast" role="status" class="toast" hidden></div>
      <input id="file-input" type="file" accept=".json,application/json" hidden />
      <dialog id="modal"><div id="modal-content"></div></dialog>
    </div>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
