<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Card Atlas — Visual Graph Editor</title>
    <link rel="icon" href="assets/images/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body>
    <div id="app" class="home-mode">
      <header class="toolbar">
        <button class="brand" data-action="home" aria-label="Card Atlas — Home">
          <span class="brand-mark">✳</span> Card Atlas
        </button>
        <button id="project-name" class="project-name"></button>
        <div class="toolbar-actions">
          <button id="open-inspector" data-i18n="inspectorTitle"></button>
          <details id="project-menu" class="project-menu">
            <summary data-i18n-title="projectMenu" aria-label="Menu dự án">
              <span aria-hidden="true">☰</span>
            </summary>
            <div class="project-menu-body">
              <div id="counts"></div>
              <p id="save-state" class="save-state"></p>
              <button data-action="format" class="text-button" data-i18n="format"></button>
              <button
                data-action="auto-route-all"
                class="text-button"
                data-i18n="autoRouteAll"
              ></button>
              <p class="session-note" data-i18n="session"></p>

              <button data-action="recovery" class="recovery-button" data-i18n="recovery"></button>
              <p id="recovery-status" class="muted recovery-status" role="status"></p>
              <div class="chatgpt-settings">
                <label>
                  <input
                    id="chatgpt-visible"
                    type="checkbox"
                    checked
                    aria-controls="chatgpt-launcher"
                  />
                  <span data-i18n="chatgptShowButton"></span>
                </label>
                <a
                  href="https://chatgpt.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  data-i18n="chatgptOpenTab"
                ></a>
                <p id="chatgpt-help" class="muted" data-i18n="chatgptHelp"></p>
              </div>
            </div>
          </details>
          <button data-action="new" data-i18n="newProject"></button
          ><button data-action="add" class="with-icon">
            <span>＋</span><span data-i18n="newCard"></span></button
          ><button data-action="connect" data-i18n="connect"></button>
          <select id="map-view" data-i18n-title="mapView">
            <option value="card" data-i18n="cardMap"></option>
            <option value="mind" data-i18n="mindMap"></option>
          </select>
          <div class="history-buttons">
            <button data-action="undo" data-i18n-title="undo">↶</button
            ><button data-action="redo" data-i18n-title="redo">↷</button>
          </div>
          <button data-action="import" data-i18n="import"></button
          ><button data-action="export" class="primary with-icon">
            <span>↑</span><span data-i18n="export"></span></button
          ><button
            id="theme-toggle"
            data-action="theme"
            data-i18n-title="darkMode"
            aria-pressed="false"
          >
            <span aria-hidden="true">◐</span><span data-i18n="lightTheme"></span></button
          ><select id="locale" aria-label="Tiếng Việt / English">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
          </select>
          <button
            type="button"
            id="quick-help"
            class="quick-help-button"
            data-action="help"
            data-i18n-title="quickHelpTitle"
            aria-haspopup="dialog"
            aria-controls="modal"
          >
            ?
          </button>
        </div>
      </header>
      <section id="home-page" class="home-page">
        <div class="home-resume">
          <button data-action="continue" data-i18n="continueProject" hidden></button>
        </div>
        <div id="template-gallery"></div>
      </section>
      <main class="workspace">
        <aside class="sidebar">
          <div id="shape-library"></div>
          <button
            type="button"
            data-action="search"
            data-i18n="searchNodes"
            aria-controls="search-drawer"
            aria-expanded="false"
          ></button>
        </aside>
        <aside id="search-drawer" class="search-drawer" hidden>
          <div class="drawer-header">
            <h2 data-i18n="searchNodes"></h2>
            <button type="button" data-action="search-close" data-i18n-title="closeSearch">
              ×
            </button>
          </div>
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span
            ><input
              id="search"
              type="search"
              data-i18n-placeholder="search"
              data-i18n-title="search"
            />
          </div>
          <div id="card-list" class="card-list"></div>
        </aside>
        <section id="canvas-region" class="canvas-region">
          <div id="chatgpt-launcher" class="chatgpt-launcher">
            <button id="chatgpt-open" type="button" data-i18n-title="chatgptOpenWindow">
              <span aria-hidden="true">↗</span><span class="chatgpt-label">ChatGPT</span>
            </button>
            <button id="chatgpt-hide" type="button" data-i18n-title="chatgptHideButton">×</button>
          </div>
          <div id="graph"></div>
          <div id="cards-layer"></div>
          <div id="welcome" class="welcome">
            <h1 data-i18n="welcome"></h1>
            <p data-i18n="welcomeBody"></p>
          </div>
          <div id="mind-map-tools" class="mind-map-tools" hidden>
            <button data-action="layout" data-i18n="arrangeMindMap"></button>
            <button data-action="expand-all" data-i18n="expandAll"></button>
          </div>
          <div
            id="layout-preview-bar"
            class="layout-preview-bar"
            role="region"
            data-i18n-title="layoutPreviewTitle"
            hidden
          >
            <strong data-i18n="layoutPreviewTitle"></strong>
            <p data-i18n="layoutPreviewHint"></p>
            <div id="layout-warnings" role="status"></div>
            <div class="layout-preview-actions">
              <button data-action="layout-cancel" data-i18n="cancel"></button
              ><button data-action="layout-reset" data-i18n="resetPreview"></button
              ><button class="primary" data-action="layout-apply" data-i18n="applyLayout"></button>
            </div>
          </div>
          <div id="mind-map-hint" hidden></div>
          <div id="connect-hint" class="connect-hint" hidden></div>
          <div class="zoom-controls">
            <button data-action="zoom-out" data-i18n-title="zoomOut">−</button
            ><button id="zoom-value" data-action="zoom-reset" data-i18n-title="resetZoom">
              100%</button
            ><button data-action="zoom-in" data-i18n-title="zoomIn">＋</button><span></span
            ><button data-action="fit" class="view-button" data-i18n-title="fit">
              <span aria-hidden="true">⛶</span><span data-i18n="fitLabel"></span>
            </button>
            <button data-action="focus" class="view-button" data-i18n-title="focus" disabled>
              <span aria-hidden="true">◎</span><span data-i18n="focusLabel"></span>
            </button>
          </div>
          <div id="selection-tools" class="selection-tools" hidden>
            <span id="selection-count" role="status" aria-live="polite"></span>
            <button type="button" data-action="group-create" data-i18n="groupCreate"></button>
            <button type="button" data-action="clear-selection" data-i18n="clearSelection"></button>
          </div>
          <div class="canvas-hint" data-i18n="hint"></div>
          <svg id="connection-preview" class="connection-preview" aria-hidden="true">
            <path></path>
          </svg>
        </section>
        <aside id="format-inspector" hidden aria-labelledby="inspector-title">
          <header>
            <h2 id="inspector-title" data-i18n="inspectorTitle"></h2>
            <button id="inspector-close" data-i18n-title="close">×</button>
          </header>
          <nav id="inspector-tabs" aria-label="Format"></nav>
          <div id="inspector-global" hidden></div>
          <div id="inspector-text" hidden></div>
          <div id="inspector-fields"></div>
        </aside>
        <dialog id="detail-panel" class="detail-panel" aria-labelledby="panel-title">
          <div class="panel-header">
            <h2 id="panel-title" tabindex="-1"></h2>
            <button data-action="detail-theme" data-i18n-title="darkMode" id="detail-theme">
              ◐
            </button>
            <button
              id="writing-exit"
              hidden
              data-action="writing-exit"
              data-i18n="exitWriting"
            ></button>
            <button data-action="expand" data-i18n-title="fullDetail">⤢</button
            ><button data-action="close" data-i18n-title="close">×</button>
          </div>
          <nav id="panel-tabs" class="panel-tabs"></nav>
          <div id="panel-body" class="panel-body"></div>
          <details id="detail-tools" class="detail-tools">
            <summary data-i18n="projectTools"></summary>
            <div class="detail-tool-actions">
              <select id="detail-map-view" data-i18n-title="mapView">
                <option value="card" data-i18n="cardMap"></option>
                <option value="mind" data-i18n="mindMap"></option>
              </select>
              <button data-panel-action="undo" data-i18n="undo"></button
              ><button data-panel-action="redo" data-i18n="redo"></button>
              <button data-panel-action="export" data-i18n="export"></button
              ><button data-panel-action="new" data-i18n="newProject"></button>
              <button data-panel-action="format" data-i18n="format"></button
              ><button data-panel-action="recovery" data-i18n="recovery"></button>
              <button data-panel-action="layout" data-i18n="arrangeMindMap"></button
              ><button data-panel-action="focus" data-i18n="focusLabel"></button
              ><button data-panel-action="fit" data-i18n="fitLabel"></button>
            </div>
          </details>
        </dialog>
      </main>
      <div class="mobile-notice" data-i18n="desktop"></div>
      <div id="toast" role="status" class="toast" hidden></div>
      <input id="file-input" type="file" accept=".json,application/json" hidden />
      <dialog id="modal"><div id="modal-content"></div></dialog>
    </div>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
